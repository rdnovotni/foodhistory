name: food-history

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - food_history_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true

  setup:
    build:
      context: .
    command: ["python", "tools/bootstrap_db.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_DATABASE_USER: ${PUBLIC_DATABASE_USER:-food_history_public}
      PUBLIC_DATABASE_PASSWORD: ${PUBLIC_DATABASE_PASSWORD:?set PUBLIC_DATABASE_PASSWORD in .env.production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: ${SITE_BASE_URL:?set SITE_BASE_URL in .env.production}
      APP_MODE: editorial
      EDITOR_COOKIE_SECURE: ${EDITOR_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  public_web:
    build:
      context: .
    profiles: ["public"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PUBLIC_DATABASE_USER:-food_history_public}:${PUBLIC_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: https://${PUBLIC_HOST:-not-configured.invalid}
      APP_MODE: public
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-not-configured.invalid}
      ACME_EMAIL: ${ACME_EMAIL:-admin@invalid.example}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      public_web:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  food_history_pgdata:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
