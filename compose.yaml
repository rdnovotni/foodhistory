services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: food_history
      POSTGRES_PASSWORD: food_history
      POSTGRES_DB: food_history
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_history -d food_history"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - food_history_pgdata:/var/lib/postgresql/data

  setup:
    build: .
    command: ["python", "tools/bootstrap_db.py"]
    environment:
      DATABASE_URL: postgresql://food_history:food_history@db:5432/food_history
      LOAD_EXAMPLES: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://food_history:food_history@db:5432/food_history
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  food_history_pgdata:
