services:
  - type: web
    name: food-history-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: python tools/bootstrap_db.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-history-staging-db
          property: connectionString

databases:
  - name: food-history-staging-db
    databaseName: food_history
    user: food_history
    postgresMajorVersion: "16"
    ipAllowList: []
