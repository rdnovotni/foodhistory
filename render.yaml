services:
  - type: web
    name: food-history-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RUN_DB_BOOTSTRAP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: food-history-staging-db
          property: connectionString

databases:
  - name: food-history-staging-db
    plan: free
    databaseName: food_history
    user: food_history
    postgresMajorVersion: "16"
    ipAllowList: []
