{% extends "base.html" %}{% block title %}Preview: {{ title }}{% endblock %}{% block content %}<article class="detail wiki-article"><p class="eyebrow">Unpublished preview</p><h1>{{ title }}</h1>{% if toc %}<nav class="wiki-toc" aria-label="On this page"><strong>On this page</strong><ol>{% for item in toc %}<li class="toc-level-{{ item.level }}"><a href="#{{ item.id }}">{{ item.title }}</a></li>{% endfor %}</ol></nav>{% endif %}<div class="wiki-body">{{ body_html|safe }}</div></article>{% endblock %}
