<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Food History{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
      <a class="brand" href="/">Food History</a>
      <nav aria-label="Primary navigation">
        <a href="/entities">Entities</a>
        <a href="/taxonomy">Taxonomy</a>
        <a href="/wiki">Wiki</a>
        <a href="/search">Search</a>
        <a href="/api/docs">API</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Research data preserves original wording, uncertainty, and cited evidence.</footer>
  </body>
</html>
