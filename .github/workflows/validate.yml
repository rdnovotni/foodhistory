name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodhistory
          POSTGRES_PASSWORD: foodhistory
          POSTGRES_DB: foodhistory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodhistory -d foodhistory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://foodhistory:foodhistory@localhost:5432/foodhistory_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Static package validation
        run: python tools/validate_package.py
      - name: Lint application
        run: ruff check app tools/bootstrap_db.py tools/smoke_test.py tools/start_web.py tests
      - name: Apply bootstrap migrations
        run: |
          for f in migrations/000{1..8}_*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed taxonomy
        run: python seeds/seed_taxonomy.py
      - name: Apply post-seed migrations
        run: |
          for f in migrations/0009_*.sql migrations/001[0-9]_*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Validate ingestion examples
        run: python ingestion/validate_examples.py
      - name: Load synthetic application examples
        run: |
          python ingestion/python/load_menu.py ingestion/examples/menu.example.json
          python ingestion/python/load_cookbook.py ingestion/examples/cookbook.example.json
          python ingestion/python/load_object.py ingestion/examples/object.example.json
      - name: Test application
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml --profile public config --quiet
          sh -n ops/*.sh
      - name: Validate public Caddy edge
        run: >-
          docker run --rm
          --env PUBLIC_HOST=history.example.com
          --env ACME_EMAIL=admin@example.com
          --volume "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Build application image
        run: docker build --tag food-history:test .
