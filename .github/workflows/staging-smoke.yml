name: Staging smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL of the staging catalogue
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed catalogue
        run: python tools/smoke_test.py --base-url "${{ inputs.base_url }}"
